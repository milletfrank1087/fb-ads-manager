      <div x-show="strategy.open" x-cloak class="fixed inset-0 z-50" @keydown.escape.window="strategy.open && closeStrategy()">
        <div class="absolute inset-0 bg-black/40" @click="closeStrategy()"></div>
        <div class="absolute inset-y-0 right-0 w-full max-w-5xl bg-meta-gray-50 shadow-2xl flex flex-col">
          <!-- header -->
          <div class="px-5 py-3 bg-white border-b border-gray-200 flex items-center flex-wrap gap-y-2 gap-3 flex-shrink-0 drawer-head">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div>
              <div class="text-sm font-bold leading-tight">Strategy Advisor</div>
              <div class="text-[11px] text-meta-gray-600">Suggest-only · reads only · never changes your ads</div>
            </div>
            <div class="flex-1"></div>
            <div class="flex items-center gap-1 bg-gray-100 rounded-md p-0.5" title="Analysis window. 30 days is the default; day-of-week & hour patterns always use up to 90 days for reliability.">
              <template x-for="w in strategyWindows" :key="w.id">
                <button @click="setStrategyWindow(w.id)" x-text="w.label.replace('Last ','')"
                        :class="strategy.window === w.id ? 'bg-white shadow-sm' : 'text-meta-gray-600'"
                        class="px-2 py-1 text-[11px] font-medium rounded"></button>
              </template>
            </div>
            <button @click="runStrategy()" :disabled="strategy.loading"
                    title="Re-run the analysis (one batched read call to Meta)."
                    class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-md hover:bg-indigo-700 disabled:opacity-50 flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" :class="strategy.loading ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              <span x-text="strategy.loading ? 'Analyzing…' : 'Re-analyze'"></span>
            </button>
            <button @click="closeStrategy()" title="Close" class="p-1.5 text-meta-gray-600 hover:bg-gray-100 rounded-md">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>

          <!-- tabs -->
          <div class="px-5 bg-white border-b border-gray-200 flex items-center gap-1 flex-shrink-0 overflow-x-auto no-scrollbar drawer-tabs">
            <button @click="setStrategyTab('briefing')"
                    :class="strategy.tab==='briefing' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-meta-gray-600 hover:text-meta-gray-800'"
                    class="px-3 py-2 text-xs font-semibold border-b-2 -mb-px"
                    title="Daily standup: where you stand TODAY vs a normal day, plus only the moves the data is confident about (sample-size + multi-day + day-of-week adjusted). Designed for a daily check-in.">
              Daily Briefing
            </button>
            <button @click="setStrategyTab('analysis')"
                    :class="strategy.tab==='analysis' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-meta-gray-600 hover:text-meta-gray-800'"
                    class="px-3 py-2 text-xs font-semibold border-b-2 -mb-px"
                    title="Full window analysis: account totals, AI weekly plan, ranked rule-based actions, and day/hour/placement/age-gender patterns over the selected window.">
              Full Analysis
            </button>
            <button @click="setStrategyTab('chat')"
                    :class="strategy.tab==='chat' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-meta-gray-600 hover:text-meta-gray-800'"
                    class="px-3 py-2 text-xs font-semibold border-b-2 -mb-px"
                    title="Ask the advisor anything about your account. It is briefed with the same live data (campaigns, ad sets, budgets, the decision digest) and the community playbook — so it can give you the exact number and structure (e.g. 'what cost cap should I set on Portugal and how?'). Suggest-only.">
              Ask Advisor
            </button>
          </div>

          <!-- body -->
          <div class="flex-1 overflow-y-auto p-5 space-y-5">
            <template x-if="strategy.loading && !strategy.data">
              <div class="text-center text-meta-gray-600 py-20">
                <svg class="w-8 h-8 mx-auto animate-spin text-indigo-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Pulling your last-90-day snapshot and crunching patterns…
              </div>
            </template>
            <template x-if="strategy.error">
              <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-4" x-text="strategy.error"></div>
            </template>

            <!-- ============ DAILY BRIEFING TAB ============ -->
            <template x-if="strategy.data && strategy.tab==='briefing' && strategy.data.decisions">
              <div class="space-y-5" x-data="{ d: strategy.data.decisions }">

                <!-- confidence legend -->
                <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-meta-gray-600 bg-meta-gray-50 border border-gray-200 rounded-lg px-3 py-2" title="How to read confidence: every action is gated by conversion sample size, how many days the signal persisted, and a day-of-week-adjusted anomaly check. Only act on high/medium.">
                  <span class="font-semibold text-meta-gray-700">Confidence:</span>
                  <span class="flex items-center gap-1"><span class="px-1.5 py-0.5 rounded border bg-green-50 text-green-700 border-green-200 font-semibold">high</span> act now</span>
                  <span class="flex items-center gap-1"><span class="px-1.5 py-0.5 rounded border bg-blue-50 text-blue-700 border-blue-200 font-semibold">medium</span> act, watch closely</span>
                  <span class="flex items-center gap-1"><span class="px-1.5 py-0.5 rounded border bg-yellow-50 text-yellow-700 border-yellow-200 font-semibold">low</span> wait for more data</span>
                  <span class="flex items-center gap-1"><span class="px-1.5 py-0.5 rounded border bg-gray-100 text-gray-500 border-gray-300 font-semibold">insufficient</span> too few conversions</span>
                  <span class="text-meta-gray-400">· σ = std-devs from the day-of-week norm (|σ|≥2 = unusual)</span>
                </div>

                <!-- today vs normal -->
                <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
                  <div class="px-4 py-2 border-b border-gray-100 flex items-center gap-2">
                    <span class="text-sm font-semibold">Today vs a normal day</span>
                    <span class="text-[11px] text-meta-gray-500" x-show="d.today.reliable" x-text="'latest complete day · ' + d.today.day + ' (' + d.today.weekday + ')'"></span>
                    <span class="flex-1"></span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded border" :class="d.today.verdict==='anomalous' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'" x-text="d.today.verdict"></span>
                  </div>
                  <div class="p-4">
                    <template x-if="!d.today.reliable">
                      <div class="text-sm text-meta-gray-600" x-text="d.today.note"></div>
                    </template>
                    <template x-if="d.today.reliable">
                      <div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                          <div class="border border-gray-100 rounded-lg p-2.5" :title="'Today $' + d.today.metrics.spend + ' vs a normal ' + d.today.weekday + ' avg $' + d.today.baseline.spend + '. σ = standard deviations from that weekday norm; |σ|≥2 = unusual.'">
                            <div class="text-[10px] text-meta-gray-500 uppercase tracking-wide">Spend</div>
                            <div class="text-base font-bold" x-text="'$' + d.today.metrics.spend"></div>
                            <div class="text-[10px] text-meta-gray-500">norm $<span x-text="d.today.baseline.spend"></span> · <span :class="zClass(d.today.z.spend)" x-text="fmtZ(d.today.z.spend)"></span></div>
                          </div>
                          <div class="border border-gray-100 rounded-lg p-2.5" :title="'Conversions (' + d.kpi + ') today vs normal ' + d.today.weekday + '.'">
                            <div class="text-[10px] text-meta-gray-500 uppercase tracking-wide" x-text="d.kpi"></div>
                            <div class="text-base font-bold" x-text="d.today.metrics.conv"></div>
                            <div class="text-[10px] text-meta-gray-500">norm <span x-text="d.today.baseline.conv"></span> · <span :class="zClass(d.today.z.conv)" x-text="fmtZ(d.today.z.conv)"></span></div>
                          </div>
                          <div class="border border-gray-100 rounded-lg p-2.5" :title="'Cost per ' + d.kpi + ' today vs a normal ' + d.today.weekday + '. A high σ here (not just high spend) is the real warning sign.'">
                            <div class="text-[10px] text-meta-gray-500 uppercase tracking-wide">Cost / <span x-text="d.kpi"></span></div>
                            <div class="text-base font-bold" x-text="d.today.metrics.cpa==null ? '—' : '$'+d.today.metrics.cpa"></div>
                            <div class="text-[10px] text-meta-gray-500">norm $<span x-text="d.today.baseline.cpa"></span> · <span :class="zClass(d.today.z.cpa)" x-text="fmtZ(d.today.z.cpa)"></span></div>
                          </div>
                          <div class="border border-gray-100 rounded-lg p-2.5" title="ROAS today vs a normal day for this weekday.">
                            <div class="text-[10px] text-meta-gray-500 uppercase tracking-wide">ROAS</div>
                            <div class="text-base font-bold" x-text="d.today.metrics.roas==null ? '—' : fmtRoasX(d.today.metrics.roas)"></div>
                            <div class="text-[10px] text-meta-gray-500">norm <span x-text="fmtRoasX(d.today.baseline.roas)"></span></div>
                          </div>
                        </div>
                        <div class="text-[12px] mt-3" :class="verdictClass(d.today.verdict)" x-text="d.today.note"></div>
                        <template x-if="d.trend7 && d.trend7.reliable">
                          <div>
                            <div class="mt-3 pt-3 border-t border-gray-100 grid grid-cols-2 md:grid-cols-5 gap-2 text-[12px]" title="Last 7 days vs the prior 7 days — a week-over-week read that is naturally day-of-week balanced. This is more trustworthy than any single day.">
                              <div><span class="text-meta-gray-500">7d cost/</span><span x-text="d.kpi"></span>: <span class="font-medium" x-text="d.trend7.last7.cpa==null?'—':'$'+d.trend7.last7.cpa"></span> <span :class="(d.trend7.cpaChangePct||0)>0?'text-red-600':'text-green-600'" x-text="'('+fmtPctSigned(d.trend7.cpaChangePct)+')'"></span></div>
                              <div><span class="text-meta-gray-500">7d ROAS:</span> <span class="font-medium" x-text="fmtRoasX(d.trend7.last7.roas)"></span> <span :class="(d.trend7.roasChangePct||0)<0?'text-red-600':'text-green-600'" x-text="'('+fmtPctSigned(d.trend7.roasChangePct)+')'"></span></div>
                              <div><span class="text-meta-gray-500">7d conv:</span> <span class="font-medium" x-text="d.trend7.last7.conv"></span> <span :class="(d.trend7.convChangePct||0)<0?'text-red-600':'text-green-600'" x-text="'('+fmtPctSigned(d.trend7.convChangePct)+')'"></span></div>
                              <div><span class="text-meta-gray-500">7d CTR:</span> <span class="font-medium" x-text="(d.trend7.last7.ctr??'—')+'%'"></span> <span :class="(d.trend7.ctrChangePct||0)<0?'text-red-600':'text-green-600'" x-text="'('+fmtPctSigned(d.trend7.ctrChangePct)+')'"></span></div>
                              <div title="Rising CPM at a flat/holding CTR is the earliest saturation signal — it shows up before CPA visibly climbs."><span class="text-meta-gray-500">7d CPM:</span> <span class="font-medium" x-text="d.trend7.last7.cpm==null?'—':'$'+d.trend7.last7.cpm"></span> <span :class="(d.trend7.cpmChangePct||0)>0?'text-red-600':'text-green-600'" x-text="'('+fmtPctSigned(d.trend7.cpmChangePct)+')'"></span></div>
                            </div>
                            <div x-show="d.trend7.earlySaturation" class="mt-2 text-[12px] text-amber-800 bg-amber-50 border border-amber-200 rounded px-2.5 py-1.5" x-text="'⚠ ' + d.trend7.note"></div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- concentration risk -->
                <template x-if="d.concentration && d.concentration.reliable">
                  <div class="rounded-lg border p-3 flex items-start gap-3" :class="d.concentration.verdict==='concentrated' ? 'border-amber-200 bg-amber-50/60' : 'border-gray-200 bg-white'" title="What share of active spend your single biggest campaign carries. Above ~40% is efficient but fragile — one fatigue cycle in that campaign can crater the whole account. The fix is a pipeline of parallel winners, not putting all budget in one.">

                    <span class="mt-0.5 px-1.5 py-0.5 rounded text-[10px] font-semibold border flex-shrink-0" :class="d.concentration.verdict==='concentrated' ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-green-50 text-green-700 border-green-200'" x-text="d.concentration.verdict"></span>
                    <div class="flex-1 min-w-0">
                      <div class="text-sm font-medium">Spend concentration — top campaign <span x-text="d.concentration.topShare + '%'"></span> of active spend</div>
                      <div class="text-[12px] text-meta-gray-600 mt-0.5" x-text="d.concentration.note"></div>
                    </div>
                  </div>
                </template>

                <!-- dayparting -->
                <template x-if="d.dayparting && d.dayparting.reliable">
                  <div class="rounded-lg border border-gray-200 bg-white p-3 flex items-start gap-3" title="Day-of-week / time-of-day performance over up to 90 days (widened for sample size). At low volume treat this as a gentle budget lean toward strong days, not a hard on/off schedule.">
                    <span class="mt-0.5 px-1.5 py-0.5 rounded text-[10px] font-semibold border bg-indigo-50 text-indigo-700 border-indigo-200 flex-shrink-0">dayparting</span>
                    <div class="flex-1 min-w-0">
                      <div class="text-sm font-medium">When to lean your budget</div>
                      <div class="text-[12px] text-meta-gray-600 mt-0.5" x-text="d.dayparting.note"></div>
                    </div>
                  </div>
                </template>

                <!-- AI daily briefing -->
                <div class="bg-white rounded-lg border border-indigo-200 overflow-hidden">
                  <div class="px-4 py-2 bg-indigo-50 border-b border-indigo-100 flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                    <span class="text-sm font-semibold text-indigo-900">AI daily briefing</span>
                    <span x-show="strategy.briefingLoading" class="text-[11px] text-indigo-500">generating…</span>
                    <span class="flex-1"></span>
                    <button @click="copyBriefing()" x-show="strategy.briefing && !strategy.briefing.error" class="text-[11px] text-indigo-600 hover:underline mr-3" title="Copy this briefing as plain text." x-text="strategy.copied ? 'copied ✓' : 'copy'"></button>
                    <button @click="runBriefing()" :disabled="strategy.briefingLoading" class="text-[11px] text-indigo-600 hover:underline" title="Regenerate the AI briefing from the latest numbers.">refresh</button>
                  </div>
                  <div class="p-4">
                    <template x-if="strategy.briefingLoading && !strategy.briefing">
                      <div class="text-sm text-meta-gray-600">Reading the numbers and writing your standup…</div>
                    </template>
                    <template x-if="strategy.briefing && strategy.briefing.error">
                      <div class="text-sm text-meta-gray-600">AI briefing unavailable: <span x-text="strategy.briefing.error"></span></div>
                    </template>
                    <template x-if="strategy.briefing && !strategy.briefing.error">
                      <div class="space-y-3">
                        <div class="text-sm font-semibold" x-text="strategy.briefing.headline"></div>
                        <div class="text-sm text-meta-gray-700" x-text="strategy.briefing.standing_today"></div>

                        <div x-show="strategy.briefing.confident_actions && strategy.briefing.confident_actions.length">
                          <div class="text-[11px] font-semibold text-green-700 uppercase tracking-wide mb-1" title="Only moves the data is confident about (enough conversions + multiple days + adjusted for day-of-week). These are safe to act on now.">✓ Confident actions</div>
                          <div class="space-y-2">
                            <template x-for="(a,i) in strategy.briefing.confident_actions" :key="i">
                              <div class="border border-green-200 bg-green-50/50 rounded-lg p-2.5">
                                <div class="flex items-center gap-2">
                                  <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold border" :class="confClass(a.confidence)" x-text="a.confidence"></span>
                                  <span class="text-sm font-medium" x-text="a.title"></span>
                                </div>
                                <div class="text-[12px] text-meta-gray-600 mt-1" x-text="a.why"></div>
                                <div x-show="a.what_to_wait_for" class="text-[11px] text-yellow-700 mt-1" x-text="'⏳ ' + a.what_to_wait_for"></div>
                              </div>
                            </template>
                          </div>
                        </div>

                        <div x-show="strategy.briefing.opportunities && strategy.briefing.opportunities.length" class="pt-1">
                          <div class="text-[11px] font-semibold text-indigo-700 uppercase tracking-wide mb-1" title="Emerging opportunities/risks at the segment level — directional, validate before shifting much budget.">◎ Opportunities</div>
                          <ul class="list-disc list-inside text-[12px] text-meta-gray-700 space-y-0.5">
                            <template x-for="(o,i) in strategy.briefing.opportunities" :key="i"><li x-text="o"></li></template>
                          </ul>
                        </div>

                        <div x-show="strategy.briefing.watch && strategy.briefing.watch.length" class="pt-1">
                          <div class="text-[11px] font-semibold text-yellow-700 uppercase tracking-wide mb-1" title="Real signals that need more days/conversions before acting — keep an eye on them.">◷ Watch (not yet confident)</div>
                          <ul class="list-disc list-inside text-[12px] text-meta-gray-600 space-y-0.5">
                            <template x-for="(w,i) in strategy.briefing.watch" :key="i"><li x-text="w"></li></template>
                          </ul>
                        </div>

                        <div x-show="strategy.briefing.do_not_act && strategy.briefing.do_not_act.length" class="pt-1">
                          <div class="text-[11px] font-semibold text-meta-gray-500 uppercase tracking-wide mb-1" title="Today's movements that are just normal daily noise — explicitly listed so you don't overreact.">✕ Don't overreact to</div>
                          <ul class="list-disc list-inside text-[12px] text-meta-gray-500 space-y-0.5">
                            <template x-for="(n,i) in strategy.briefing.do_not_act" :key="i"><li x-text="n"></li></template>
                          </ul>
                        </div>

                        <div x-show="strategy.briefing.growth_moves && strategy.briefing.growth_moves.length" class="pt-1">
                          <div class="text-[11px] font-semibold text-emerald-700 uppercase tracking-wide mb-1" title="How to GROW donations (separate from defensive actions). Ranked by incrementality: prospecting (donor lookalikes, interests) drives real net-new revenue; retargeting is kept small; bid caps are avoided at this budget.">↑ Growth moves (raise donations)</div>
                          <div class="space-y-1.5">
                            <template x-for="(g,i) in strategy.briefing.growth_moves" :key="i">
                              <div class="flex items-start gap-2 text-[12px]">
                                <span class="mt-0.5 px-1.5 py-0.5 rounded text-[10px] font-semibold border flex-shrink-0" :class="g.impact==='high' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : (g.impact==='low' ? 'bg-gray-100 text-gray-500 border-gray-300' : 'bg-teal-50 text-teal-700 border-teal-200')" x-text="g.impact"></span>
                                <div>
                                  <span class="font-medium text-meta-gray-800" x-text="g.title"></span>
                                  <span class="text-[10px] text-meta-gray-400" x-text="'· ' + g.effort"></span>
                                  <div class="text-meta-gray-600" x-text="g.why"></div>
                                </div>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- growth & funnel (data-driven, suggest-only) -->
                <template x-if="d.growth">
                  <div class="bg-white rounded-lg border border-emerald-200">
                    <div class="px-4 py-2 border-b border-emerald-100 flex items-center gap-2 bg-emerald-50/50">
                      <span class="text-sm font-semibold text-emerald-800">Growth &amp; funnel</span>
                      <span class="text-[11px] text-meta-gray-500" title="Where donors fall out of the funnel, the warmest retargeting pool, and the ranked levers to expand revenue. Suggest-only.">revenue expansion · suggest-only</span>
                    </div>
                    <div class="p-3 space-y-3">
                      <!-- funnel -->
                      <div x-show="d.growth.funnel && d.growth.funnel.steps" title="Account funnel over the window. The biggest % drop tells you the bottleneck: landing→add-to-cart leaks = page/offer/creative-match problem; checkout→donation leaks = the warmest, genuinely-incremental retargeting pool.">
                        <div class="flex flex-wrap items-stretch gap-1.5">
                          <template x-for="(s,i) in (d.growth.funnel ? d.growth.funnel.steps : [])" :key="i">
                            <div class="flex items-center gap-1.5">
                              <div class="px-2 py-1 rounded border border-gray-200 bg-meta-gray-50 text-center min-w-[84px]">
                                <div class="text-[10px] text-meta-gray-500" x-text="s.label"></div>
                                <div class="text-[13px] font-semibold text-meta-gray-800" x-text="fmtInt(s.count)"></div>
                                <div x-show="i>0" class="text-[9px]" :class="s.dropPct>=70 ? 'text-red-600' : (s.dropPct>=40 ? 'text-amber-600' : 'text-meta-gray-400')" x-text="i>0 ? ('−'+s.dropPct+'%') : ''"></div>
                              </div>
                              <span x-show="i < (d.growth.funnel.steps.length-1)" class="text-meta-gray-300">→</span>
                            </div>
                          </template>
                        </div>
                        <div x-show="d.growth.funnel && d.growth.funnel.note" class="text-[12px] text-meta-gray-600 mt-1.5" x-text="d.growth.funnel ? d.growth.funnel.note : ''"></div>
                      </div>
                      <!-- ranked levers -->
                      <div>
                        <div class="text-[11px] font-semibold text-meta-gray-500 uppercase tracking-wide mb-1" title="Growth levers ranked by what actually drives net-new donations for a low-budget account. 'foundational/primary' first; 'avoid' = wrong tool at this budget.">Ranked growth levers</div>
                        <div class="space-y-1">

                      <tbody>
                        <template x-for="p in strategy.data.patterns.weekday.rows" :key="p.day">
                          <tr :class="strategy.data.patterns.weekday.reliable && p.day === strategy.data.patterns.weekday.best?.day ? 'bg-green-50' : (strategy.data.patterns.weekday.reliable && p.day === strategy.data.patterns.weekday.worst?.day ? 'bg-red-50' : '')">

                  <!-- trend -->

                      <div class="space-y-1.5 text-[13px]">

                        <div class="flex justify-between"><span class="text-meta-gray-600">Cost / <span x-text="strategy.data.kpi.label"></span></span><span><span x-text="formatMoney(strategy.data.patterns.trend.firstHalf.cpa)"></span> → <span class="font-medium" x-text="formatMoney(strategy.data.patterns.trend.secondHalf.cpa)"></span> <span :class="(strategy.data.patterns.trend.cpaChangePct||0) > 0 ? 'text-red-600' : 'text-green-600'" x-text="'(' + fmtPctSigned(strategy.data.patterns.trend.cpaChangePct) + ')'"></span></span></div>
                        <div class="flex justify-between"><span class="text-meta-gray-600">CTR</span><span><span x-text="(strategy.data.patterns.trend.firstHalf.ctr ?? '—') + '%'"></span> → <span class="font-medium" x-text="(strategy.data.patterns.trend.secondHalf.ctr ?? '—') + '%'"></span> <span :class="(strategy.data.patterns.trend.ctrChangePct||0) < 0 ? 'text-red-600' : 'text-green-600'" x-text="'(' + fmtPctSigned(strategy.data.patterns.trend.ctrChangePct) + ')'"></span></span></div>
                      </div>
                    </template>
                    <template x-if="!strategy.data.patterns.trend.reliable"><div class="text-[12px] text-meta-gray-500">Not enough daily data.</div></template>

                    <div x-show="strategy.data.patterns.placement.best" class="text-[12px] mb-2">

                      <span class="mx-1">·</span>
                      <span class="text-red-700 font-medium">Worst:</span> <span x-text="strategy.data.patterns.placement.worst?.label"></span>

                    </div>
                    <table class="w-full text-[12px]">
                      <tbody>
                        <template x-for="(p, i) in strategy.data.patterns.placement.rows.slice(0,6)" :key="i">
                          <tr><td class="py-0.5" x-text="p.label"></td><td class="text-right text-meta-gray-600" x-text="formatMoney(p.spend)"></td><td class="text-right font-medium" x-text="fmtRoasX(p.roas)"></td></tr>
                        </template>
                      </tbody>
                    </table>
                  </div>

                  <!-- hour + age/gender -->
                  <div class="bg-white rounded-lg border border-gray-200 p-4 space-y-3">
                    <div>
                      <div class="flex items-center gap-2 mb-1">
                        <span class="text-sm font-semibold">Best hours</span>
                        <span x-show="!strategy.data.patterns.hourly.reliable" class="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-meta-gray-500 border border-gray-200">low data</span>
                      </div>
                      <div class="text-[12px]" x-show="strategy.data.patterns.hourly.best">
                        <span class="text-green-700 font-medium">Best:</span> <span x-text="strategy.data.patterns.hourly.best?.hour"></span>
                        <span class="mx-1">·</span>
                        <span class="text-red-700 font-medium">Worst:</span> <span x-text="strategy.data.patterns.hourly.worst?.hour"></span>
                      </div>
                    </div>
                    <div>
                      <div class="flex items-center gap-2 mb-1">
                        <span class="text-sm font-semibold">Top demographic</span>
                        <span x-show="!strategy.data.patterns.ageGender.reliable" class="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-meta-gray-500 border border-gray-200">low data</span>
                      </div>
                      <div class="text-[12px]" x-show="strategy.data.patterns.ageGender.best">
                        <span class="text-green-700 font-medium">Best:</span> <span x-text="strategy.data.patterns.ageGender.best?.label"></span> <span class="text-meta-gray-500" x-text="'(ROAS ' + fmtRoasX(strategy.data.patterns.ageGender.best?.roas) + ')'"></span>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- learning-phase table -->
                <div class="bg-white rounded-lg border border-gray-200">
                  <div class="px-4 py-2 border-b border-gray-100 flex items-center gap-2">
                    <span class="text-sm font-semibold">Learning-phase health (active ad sets)</span>
                    <span class="text-[11px] text-meta-gray-500" title="An ad set needs ~50 conversions/week to exit Meta's learning phase. Min budget to get there ≈ cost-per-result × 7–10/day.">~50 events/wk needed</span>
                  </div>
                  <!-- MOBILE: learning-phase ad sets as cards -->
                  <div class="md:hidden divide-y divide-gray-100">
                    <template x-for="a in strategy.data.adsets.filter(x => x.status === 'ACTIVE')" :key="'mlp-'+a.id">
                      <div class="px-3 py-2.5">
                        <div class="flex items-start justify-between gap-2 mb-1.5">
                          <div class="min-w-0">
                            <div class="font-medium text-[13px] truncate" x-text="a.name"></div>
                            <div class="text-[10px] text-meta-gray-500 truncate" x-text="a.campaignName"></div>
                          </div>
                          <span class="shrink-0 px-1.5 py-0.5 rounded text-[10px] font-medium border"
                                :class="a.learningLimited ? 'bg-yellow-50 text-yellow-700 border-yellow-200' : 'bg-green-50 text-green-700 border-green-200'"
                                x-text="a.learningLimited ? 'Limited' : 'OK'"></span>
                        </div>
                        <div class="grid grid-cols-3 gap-x-2 gap-y-1.5">
                          <div><div class="mmetric-k">Spend</div><div class="mmetric-v tabular-nums" x-text="formatMoney(a.spend)"></div></div>
                          <div><div class="mmetric-k">Events/wk</div><div class="mmetric-v tabular-nums" :class="a.learningLimited ? 'text-yellow-700' : 'text-green-700'" x-text="a.weeklyEvents"></div></div>
                          <div><div class="mmetric-k">Cost</div><div class="mmetric-v tabular-nums" x-text="formatMoney(a.kpiCpa)"></div></div>
                          <div><div class="mmetric-k">Budget/day</div><div class="mmetric-v tabular-nums" x-text="a.dailyBudget != null ? formatMoney(a.dailyBudget) : '—'"></div></div>
                          <div><div class="mmetric-k">Min to exit</div><div class="mmetric-v tabular-nums" x-text="a.minDailyToExit != null ? formatMoney(a.minDailyToExit) : '—'"></div></div>
                        </div>
                      </div>
                    </template>
                  </div>
                  <div class="overflow-x-auto hidden md:block">
                    <table class="w-full text-[12px]">
                      <thead><tr class="text-meta-gray-500 text-left border-b border-gray-100">
                        <th class="font-medium px-3 py-1.5">Ad set</th>
                        <th class="font-medium text-right">Spend</th>
                        <th class="font-medium text-right" title="Estimated conversions per week vs the 50 needed.">Events/wk</th>
                        <th class="font-medium text-right">Cost</th>
                        <th class="font-medium text-right">Budget/day</th>
                        <th class="font-medium text-right" title="Daily budget needed to reach ~50 events/week at the current cost.">Min to exit</th>
                        <th class="font-medium text-center">Status</th>
                      </tr></thead>
                      <tbody>
                        <template x-for="a in strategy.data.adsets.filter(x => x.status === 'ACTIVE')" :key="a.id">
                          <tr class="border-b border-gray-50">
                            <td class="px-3 py-1.5">
                              <div class="font-medium truncate max-w-[260px]" x-text="a.name"></div>
                              <div class="text-[10px] text-meta-gray-500 truncate max-w-[260px]" x-text="a.campaignName"></div>
                            </td>
                            <td class="text-right" x-text="formatMoney(a.spend)"></td>
                            <td class="text-right font-medium" :class="a.learningLimited ? 'text-yellow-700' : 'text-green-700'" x-text="a.weeklyEvents"></td>
                            <td class="text-right" x-text="formatMoney(a.kpiCpa)"></td>
                            <td class="text-right" x-text="a.dailyBudget != null ? formatMoney(a.dailyBudget) : '—'"></td>
                            <td class="text-right" x-text="a.minDailyToExit != null ? formatMoney(a.minDailyToExit) : '—'"></td>

                              <span class="px-1.5 py-0.5 rounded text-[10px] font-medium border"

                                    x-text="a.learningLimited ? 'Limited' : 'OK'"></span>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>

                <div class="text-[10px] text-meta-gray-400 text-center pt-1">

                </div>
              </div>
            </template>

            <!-- ============ ASK ADVISOR (CHAT) TAB ============ -->
            <template x-if="strategy.tab==='chat'">
              <div class="flex flex-col" style="height: 100%; min-height: 420px;">
                <!-- Tier A: standing operator brief (memory the advisor honors every turn) -->
                <div class="mb-2 border border-gray-200 rounded-lg bg-gray-50/70 flex-shrink-0">
                  <button @click="strategy.briefOpen = !strategy.briefOpen" type="button"
                          class="w-full flex items-center gap-1.5 px-2.5 py-1.5 text-left hover:bg-gray-100/70 rounded-lg"
                          title="A standing brief the advisor remembers in every chat: your targets, risk tolerance, campaigns it must never touch, and your brand voice for comment replies.">
                    <svg class="w-3.5 h-3.5 text-indigo-500 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
                    <span class="text-[12px] font-medium text-meta-gray-700">Operator brief &amp; memory</span>
                    <span class="text-[10.5px] text-meta-gray-400 truncate">— targets, sacred campaigns, brand voice (the advisor remembers this)</span>
                    <svg class="w-3.5 h-3.5 text-meta-gray-300 ml-auto flex-shrink-0 transition-transform" :class="strategy.briefOpen ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                  </button>
                  <div x-show="strategy.briefOpen" x-cloak class="px-2.5 pb-2.5 pt-1 border-t border-gray-200 space-y-3">
                    <!-- Account-level (genuinely global) -->
                    <div>
                      <div class="text-[10px] uppercase tracking-wide text-meta-gray-400 font-semibold mb-1">Account-wide</div>
                      <div class="grid grid-cols-1 gap-2">
                        <label class="block">
                          <span class="text-[10px] uppercase tracking-wide text-meta-gray-400">Risk tolerance</span>
                          <select x-model="strategy.profile.riskTolerance" class="w-full text-[12px] border border-gray-200 rounded px-2 py-1 mt-0.5" title="Conservative = words-only / duplicates over live edits. Aggressive = bolder scaling proposals.">
                            <option value="conservative">Conservative — prefer words & paused duplicates</option>
                            <option value="balanced">Balanced</option>
                            <option value="aggressive">Aggressive — bolder scaling proposals</option>
                          </select>
                        </label>
                        <label class="block">
                          <span class="text-[10px] uppercase tracking-wide text-meta-gray-400">Brand voice (used when drafting comment replies)</span>
                          <textarea x-model="strategy.profile.brandVoice" rows="2" placeholder="Warm, sincere, factual. Thank donors. Never over-promise outcomes. Reply in the commenter's language." class="w-full text-[12px] border border-gray-200 rounded px-2 py-1 mt-0.5" title="How replies should sound. The advisor writes comment replies in this voice."></textarea>
                        </label>
                        <label class="block">
                          <span class="text-[10px] uppercase tracking-wide text-meta-gray-400">Notes / standing instructions</span>
                          <textarea x-model="strategy.profile.notes" rows="2" placeholder="e.g. one pixel shared across beneficiaries; donations vary in size; prefer prospecting over retargeting." class="w-full text-[12px] border border-gray-200 rounded px-2 py-1 mt-0.5"></textarea>
                        </label>
                      </div>
                    </div>
                    <!-- Per-campaign goals (each beneficiary differs) -->
                    <div>
                      <div class="flex items-center gap-2 mb-1">
                        <span class="text-[10px] uppercase tracking-wide text-meta-gray-400 font-semibold">Per-campaign goals</span>
                        <span class="text-[10px] text-meta-gray-400">— each campaign has its own target; the advisor judges each against its own goal</span>
                      </div>
                      <div class="space-y-2">
                        <template x-for="(cg, ci) in strategy.profile.campaigns" :key="ci">

                            <div class="flex items-center gap-2">
                              <input x-model="cg.name" list="advisor-campaign-list" type="text" placeholder="Campaign name (or part of it)" class="flex-1 text-[12px] border border-gray-200 rounded px-2 py-1">
                              <label class="flex items-center gap-1 text-[11px] text-meta-gray-600 whitespace-nowrap" title="Sacred = never propose pausing or changing its budget (words only). Duplicating to test is still allowed.">

                              </label>
                              <button @click="removeCampaignGoal(ci)" type="button" class="text-meta-gray-300 hover:text-red-500" title="Remove">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                              </button>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                              <select x-model="cg.goal" class="text-[12px] border border-gray-200 rounded px-1.5 py-1" title="What success looks like for THIS campaign.">
                                <option value="">Goal…</option>
                                <option value="maximize_donations">Maximize donations</option>
                                <option value="hold_cpa">Hold CPA</option>
                                <option value="hold_roas">Hold ROAS</option>
                                <option value="awareness">Awareness/reach</option>
                                <option value="maintain">Maintain (no changes)</option>
                              </select>
                              <input x-model="cg.targetCpa" type="text" placeholder="Target CPA" class="text-[12px] border border-gray-200 rounded px-2 py-1">
                              <input x-model="cg.targetRoas" type="text" placeholder="Target ROAS" class="text-[12px] border border-gray-200 rounded px-2 py-1">
                            </div>
                            <input x-model="cg.notes" type="text" placeholder="Notes for this campaign (optional)" class="w-full text-[12px] border border-gray-200 rounded px-2 py-1">
                          </div>
                        </template>
                        <datalist id="advisor-campaign-list">
                          <template x-for="(n, ni) in snapshotCampaignNames" :key="ni"><option :value="n"></option></template>
                        </datalist>
                        <button @click="addCampaignGoal()" type="button" class="text-[11px] text-indigo-600 border border-indigo-200 bg-indigo-50/60 hover:bg-indigo-100 rounded-lg px-2.5 py-1">+ Add campaign goal</button>
                      </div>
                    </div>
                    <div class="flex items-center gap-2 pt-1 border-t border-gray-100">
                      <button @click="saveProfile()" :disabled="strategy.briefSaving" type="button" class="text-[12px] font-medium px-3 py-1 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50" x-text="strategy.briefSaving ? 'Saving…' : 'Save brief'"></button>

                      <span class="ml-auto text-[10px] text-meta-gray-400">Stored locally; injected into every chat as memory.</span>
                    </div>
                    <!-- Live actions arm switch -->
                    <div class="flex items-center gap-2 pt-2 border-t border-gray-100">
                      <button @click="toggleArm()" :disabled="strategy.armBusy || strategy.envForced" type="button"

                        <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform" :class="strategy.armed ? 'translate-x-4' : 'translate-x-0.5'"></span>
                      </button>
                      <div class="text-[11px]">
                        <span class="font-medium" :class="strategy.armed ? 'text-red-600' : 'text-meta-gray-600'" x-text="strategy.armed ? 'Live actions ON — approvals execute on Meta' : 'Live actions OFF — approvals are safe dry-runs'"></span>
                        <span x-show="strategy.envForced" class="text-meta-gray-400"> (forced on by env)</span>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- messages scroll area -->
                <div id="advisor-chat-scroll" class="flex-1 overflow-y-auto space-y-3 pr-1">

                    <div class="text-center text-meta-gray-600 py-6">
                      <div class="w-10 h-10 mx-auto rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mb-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4-.8L3 20l1.3-3.9A7.95 7.95 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                      </div>
                      <div class="text-sm font-semibold text-meta-gray-800">Ask the advisor</div>
                      <div class="text-[12px] text-meta-gray-500 max-w-md mx-auto mt-1">It's briefed with this account's live data — campaigns, ad sets, budgets, the decision digest, growth funnel and <b>comments</b> — plus the community playbook and your saved brief. It pulls fresh numbers on its own and can propose ad <b>and comment</b> changes you approve. Ask in plain English — no need to name a tool.</div>
                      <div class="flex flex-wrap justify-center gap-2 mt-4">
                        <template x-for="(q, i) in advisorSuggestions" :key="i">
                          <button @click="chatSuggest(q)" :disabled="!strategy.data || strategy.chat.loading"
                                  class="text-[12px] px-3 py-1.5 rounded-full border border-indigo-200 text-indigo-700 bg-indigo-50/60 hover:bg-indigo-100 disabled:opacity-50"
                                  x-text="q"></button>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- messages -->
                  <template x-for="(m, i) in strategy.chat.messages" :key="i">
                    <div :class="m.system ? 'flex justify-center' : (m.role==='user' ? 'flex justify-end' : 'flex justify-start')">
                      <!-- auto-continue note (after an approve/reject) -->
                      <template x-if="m.system">
                        <div class="text-[10.5px] text-meta-gray-400 bg-gray-100 rounded-full px-3 py-1 max-w-[90%] truncate" :title="m.content" x-text="m.content"></div>
                      </template>
                      <template x-if="!m.system">
                      <div :class="m.role==='user' ? 'bg-indigo-600 text-white rounded-2xl rounded-br-sm px-3.5 py-2 max-w-[80%]' : 'bg-white border border-gray-200 text-meta-gray-800 rounded-2xl rounded-bl-sm px-3.5 py-2.5 max-w-[88%]'">
                        <div x-show="m.role==='user'" class="text-[13px] whitespace-pre-wrap" x-text="m.content"></div>
                        <!-- read-only tool activity (Cursor-style collapsible cards) — these never change anything in Meta -->
                        <template x-if="m.role==='assistant' && m.tools && m.tools.length">
                          <div class="mb-2 space-y-1">
                            <template x-for="(t, ti) in m.tools" :key="ti">
                              <div class="border rounded-lg overflow-hidden"
                                   :class="t.status==='failed' ? 'border-red-200 bg-red-50/40' : 'border-gray-200 bg-gray-50/70'">
                                <button @click="t.expanded = !t.expanded" type="button"
                                        class="w-full flex items-center gap-1.5 px-2 py-1 text-left hover:bg-gray-100/70 transition-colors">
                                  <span class="text-meta-gray-400 flex-shrink-0" x-html="toolIcon(t.name)"></span>
                                  <svg x-show="t.status==='running'" class="w-3 h-3 animate-spin text-indigo-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                                  <svg x-show="t.status==='done'" class="w-3 h-3 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                  <svg x-show="t.status==='failed'" class="w-3 h-3 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                  <span class="text-[11px] font-medium text-meta-gray-700 flex-shrink-0" x-text="t.label"></span>
                                  <span x-show="t.summary" class="text-[11px] text-meta-gray-400 truncate" x-text="'· ' + t.summary"></span>
                                  <svg class="w-3 h-3 text-meta-gray-300 ml-auto flex-shrink-0 transition-transform" :class="t.expanded ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                </button>
                                <div x-show="t.expanded" x-cloak class="px-2.5 pb-1.5 pt-1 border-t border-gray-200/70 bg-white/70">
                                  <div class="text-[9.5px] uppercase tracking-wide text-meta-gray-400 mb-0.5">arguments</div>
                                  <pre class="text-[10.5px] text-meta-gray-600 whitespace-pre-wrap break-words font-mono leading-snug" x-text="prettyArgs(t.args)"></pre>
                                  <template x-if="t.summary">
                                    <div class="mt-1.5"><div class="text-[9.5px] uppercase tracking-wide text-meta-gray-400 mb-0.5">result</div><div class="text-[10.5px] text-meta-gray-600" x-text="t.summary"></div></div>
                                  </template>
                                </div>
                              </div>
                            </template>
                          </div>
                        </template>
                        <div x-show="m.role==='assistant'" class="text-[13px] leading-relaxed advisor-md">
                          <span x-html="renderMd(m.content)"></span><span x-show="m.streaming" class="inline-block w-1.5 h-3.5 ml-0.5 bg-indigo-400 animate-pulse align-middle"></span>
                        </div>
                        <!-- Tier-2 write approvals — the operator must Approve before anything hits Meta -->
                        <template x-if="m.role==='assistant' && m.approvals && m.approvals.length">
                          <div class="mt-2 space-y-2">
                            <template x-for="(a, ai) in m.approvals" :key="a.id">
                              <div class="border rounded-xl overflow-hidden shadow-sm"
                                   :class="a.risk==='destructive' ? 'border-red-300' : (a.risk==='high' ? 'border-amber-300' : 'border-indigo-200')">
                                <!-- header -->
                                <div class="px-3 py-1.5 flex items-center gap-2"
                                     :class="a.risk==='destructive' ? 'bg-red-50' : (a.risk==='high' ? 'bg-amber-50' : 'bg-indigo-50')">
                                  <svg class="w-3.5 h-3.5 flex-shrink-0" :class="a.risk==='destructive' ? 'text-red-600' : (a.risk==='high' ? 'text-amber-600' : 'text-indigo-600')" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
                                  <span class="text-[12px] font-semibold text-meta-gray-800" x-text="a.action"></span>
                                  <span class="ml-auto text-[9px] font-semibold uppercase tracking-wide px-1.5 py-0.5 rounded"
                                        :class="a.risk==='destructive' ? 'bg-red-100 text-red-700' : (a.risk==='high' ? 'bg-amber-100 text-amber-700' : (a.risk==='low' ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-100 text-indigo-700'))"
                                        x-text="a.risk"></span>
                                </div>
                                <!-- body: exact target + change diff (not the AI's paraphrase) -->
                                <div class="px-3 py-2 text-[12px] space-y-1 bg-white">
                                  <div><span class="text-meta-gray-400" x-text="a.kind==='comment' ? 'Comment:' : 'Target:'"></span> <span class="font-medium text-meta-gray-800" x-text="a.entityName"></span> <span class="text-meta-gray-400 text-[10.5px]" x-text="a.kind==='comment' ? '· comment' : ('· ' + a.level + ' · id ' + a.entityId)"></span></div>
                                  <!-- a drafted reply gets its own quoted block so the operator reviews the exact wording -->
                                  <template x-if="a.kind==='comment' && a.replyText">
                                    <div class="text-[12px] text-meta-gray-700 border-l-2 border-indigo-300 bg-indigo-50/50 rounded-r px-2 py-1 mt-1">
                                      <span class="text-[9.5px] uppercase tracking-wide text-indigo-400">reply to post</span>
                                      <div x-text="a.replyText"></div>
                                    </div>
                                  </template>
                                  <template x-if="a.change && !(a.kind==='comment' && a.replyText)">
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                      <span class="text-meta-gray-400" x-text="a.change.field + ':'"></span>
                                      <span class="line-through text-meta-gray-400" x-text="a.change.from"></span>
                                      <span class="text-meta-gray-400">→</span>
                                      <span class="font-semibold" :class="a.risk==='destructive' ? 'text-red-600' : 'text-emerald-600'" x-text="a.change.to"></span>
                                      <span x-show="a.change.pct != null" class="text-[10.5px] text-meta-gray-400" x-text="'(' + (a.change.pct>0?'+':'') + a.change.pct + '%)'"></span>
                                    </div>
                                  </template>
                                  <div x-show="a.reason" class="text-meta-gray-600"><span class="text-meta-gray-400">Why:</span> <span x-text="a.reason"></span></div>
                                  <div x-show="a.warning" class="text-[11px] text-amber-800 bg-amber-50 border border-amber-100 rounded px-2 py-1 mt-1" x-text="a.warning"></div>
                                  <div x-show="!strategy.armed && a.status==='pending'" class="text-[11px] text-meta-gray-600 bg-gray-50 border border-gray-200 rounded px-2 py-1 mt-1">Live actions are <b>off</b> — approving runs a safe dry-run (nothing is sent to Meta). Flip <b>Live actions ON</b> in the brief above to make approvals execute.</div>
                                </div>
                                <!-- action bar / receipt -->
                                <div class="px-3 py-2 border-t border-gray-100 bg-gray-50/60">
                                  <template x-if="a.status==='pending'">
                                    <div class="flex items-center gap-2">
                                      <button @click="approveAction(i, ai)" :disabled="strategy.chat.loading" type="button"
                                              class="text-[12px] font-medium px-3 py-1 rounded-lg text-white disabled:opacity-50"
                                              :class="a.risk==='destructive' ? 'bg-red-600 hover:bg-red-700' : 'bg-emerald-600 hover:bg-emerald-700'"
                                              x-text="strategy.armed ? 'Approve & apply' : 'Approve (dry-run)'"></button>
                                      <button @click="rejectAction(i, ai)" :disabled="strategy.chat.loading" type="button"
                                              class="text-[12px] font-medium px-3 py-1 rounded-lg border border-gray-300 text-meta-gray-600 hover:bg-gray-100 disabled:opacity-50">Reject</button>
                                      <span class="ml-auto text-[10px] text-meta-gray-400">You approve — the AI never applies on its own.</span>
                                    </div>
                                  </template>
                                  <template x-if="a.status==='approving'">
                                    <span class="text-[12px] text-indigo-600 flex items-center gap-1.5"><svg class="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Applying…</span>
                                  </template>
                                  <template x-if="a.status==='applied'">
                                    <span class="text-[12px] text-emerald-600 font-medium flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Applied to Meta</span>
                                  </template>
                                  <template x-if="a.status==='dryrun'">
                                    <span class="text-[12px] text-meta-gray-600 flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Approved (dry-run) — nothing sent to Meta</span>
                                  </template>
                                  <template x-if="a.status==='failed'">
                                    <span class="text-[12px] text-red-600 flex items-center gap-1" x-text="'✕ ' + (a.resultMsg || 'Failed')"></span>
                                  </template>
                                  <template x-if="a.status==='rejected'">
                                    <span class="text-[12px] text-meta-gray-500 flex items-center gap-1">✕ Rejected</span>
                                  </template>
                                </div>
                              </div>
                            </template>
                          </div>
                        </template>
                        <!-- inline ad-creative previews requested by the advisor -->
                        <template x-if="m.role==='assistant' && m.previews && m.previews.length">
                          <div class="mt-2 space-y-2">
                            <template x-for="(p, pi) in m.previews" :key="pi">
                              <div class="border border-gray-200 rounded-lg overflow-hidden bg-gray-50">
                                <div class="px-2 py-1 text-[10px] text-meta-gray-500 border-b border-gray-200 bg-white" x-text="'Ad preview · ' + (p.adName || '')"></div>
                                <div class="overflow-auto" style="max-height: 360px;" x-html="p.iframe"></div>
                              </div>
                            </template>
                          </div>
                        </template>
                        <!-- Tier D: suggested follow-ups (click to ask) -->
                        <template x-if="m.role==='assistant' && !m.streaming && m.followups && m.followups.length">
                          <div class="mt-2 flex flex-wrap gap-1.5">
                            <template x-for="(q, qi) in m.followups" :key="qi">
                              <button @click="useFollowup(q)" :disabled="strategy.chat.loading" type="button"
                                      class="text-[11px] text-indigo-600 border border-indigo-200 bg-indigo-50/60 hover:bg-indigo-100 rounded-full px-2.5 py-1 disabled:opacity-50 text-left">
                                <span class="text-indigo-400 mr-0.5">↳</span><span x-text="q"></span>
                              </button>
                            </template>
                          </div>
                        </template>
                        <div x-show="m.role==='assistant' && m.model && !m.streaming" class="mt-1.5 flex items-center gap-2">
                          <button @click="_copyText(m.content)" class="text-[10px] text-meta-gray-400 hover:text-indigo-600" title="Copy this answer">copy</button>
                          <span class="text-[10px] text-meta-gray-300" x-text="m.model"></span>
                        </div>
                      </div>
                      </template>
                    </div>
                  </template>

                  <!-- typing indicator (only until the first streamed token arrives) -->
                  <template x-if="strategy.chat.loading && (!strategy.chat.messages.length || strategy.chat.messages[strategy.chat.messages.length-1].role === 'user')">
                    <div class="flex justify-start">
                      <div class="bg-white border border-gray-200 rounded-2xl rounded-bl-sm px-4 py-3 text-meta-gray-500 text-[13px] flex items-center gap-2">
                        <svg class="w-4 h-4 animate-spin text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        thinking…
                      </div>
                    </div>
                  </template>

                  <template x-if="strategy.chat.error">
                    <div class="bg-red-50 border border-red-200 text-red-700 text-[12px] rounded-lg p-3" x-text="strategy.chat.error"></div>
                  </template>
                </div>

                <!-- input bar -->
                <div class="flex-shrink-0 pt-3 mt-2 border-t border-gray-200">
                  <div class="flex items-end gap-2">
                    <textarea x-model="strategy.chat.input" rows="1"
                              @keydown.enter.prevent="if (!$event.shiftKey) sendChat()"
                              :disabled="strategy.chat.loading"
                              placeholder="Ask about budgets, caps, audiences, scaling, the funnel…"
                              class="flex-1 resize-none text-[13px] border border-gray-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-300 max-h-32"></textarea>
                    <button @click="sendChat()" :disabled="strategy.chat.loading || !strategy.chat.input.trim()"
                            class="flex-shrink-0 bg-indigo-600 text-white text-sm font-medium px-4 py-2.5 rounded-xl hover:bg-indigo-700 disabled:opacity-50">Send</button>
                  </div>
                  <div class="text-[10px] text-meta-gray-400 mt-1.5 text-center">Grounded in your last analysis (<span x-text="strategy.data ? strategy.data.window : '—'"></span>) · it can fetch live data &amp; propose changes you approve · Enter to send, Shift+Enter for newline</div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
