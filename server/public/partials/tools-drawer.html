      <div x-show="tools.open" x-cloak class="fixed inset-0 z-50" @keydown.escape.window="tools.open && closeTools()">
        <div class="absolute inset-0 bg-black/30" @click="closeTools()" title="Close"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-3xl bg-white shadow-2xl flex flex-col"
             x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
          <!-- Header -->
          <div class="px-5 py-3 border-b border-gray-200 flex items-center gap-3 flex-shrink-0">
            <div class="w-8 h-8 rounded-lg bg-meta-blue/10 text-meta-blue flex items-center justify-center flex-shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-sm font-bold leading-tight truncate" x-text="tools.row?.name || 'Insights'"></div>
              <div class="text-[11px] text-meta-gray-600" x-text="(tools.level || '') + ' · read-only intelligence'"></div>
            </div>
            <button @click="closeTools()" class="text-meta-gray-600 hover:text-meta-gray-900 p-1" title="Close (Esc)">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <!-- Tabs -->
          <div class="px-5 pt-3 flex items-center gap-1 border-b border-gray-200 flex-shrink-0">
            <button @click="setToolsTab('breakdowns')" class="px-3 py-2 text-xs font-semibold border-b-2 -mb-px"
                    :class="tools.tab === 'breakdowns' ? 'border-meta-blue text-meta-blue' : 'border-transparent text-meta-gray-600 hover:text-meta-gray-900'"
                    title="Performance broken down by audience and placement dimensions — find what's actually working.">Breakdowns</button>
            <button @click="setToolsTab('history')" class="px-3 py-2 text-xs font-semibold border-b-2 -mb-px"
                    :class="tools.tab === 'history' ? 'border-meta-blue text-meta-blue' : 'border-transparent text-meta-gray-600 hover:text-meta-gray-900'"
                    title="Change history — who changed status, budget, targeting, etc. and when (from Meta's activity log).">Change history</button>
            <template x-if="tools.level === 'ad'">
              <button @click="setToolsTab('preview')" class="px-3 py-2 text-xs font-semibold border-b-2 -mb-px"
                      :class="tools.tab === 'preview' ? 'border-meta-blue text-meta-blue' : 'border-transparent text-meta-gray-600 hover:text-meta-gray-900'"
                      title="See exactly how this ad renders in different placements (live preview from Meta).">Preview</button>
            </template>
          </div>

          <!-- Body -->
          <div class="flex-1 overflow-y-auto scrollbar-thin p-5">

            <!-- BREAKDOWNS -->
            <div x-show="tools.tab === 'breakdowns'">
              <div class="flex items-center gap-2 flex-wrap mb-3">
                <select x-model="tools.breakdown" @change="loadBreakdowns()"
                        class="border border-gray-300 rounded px-2 py-1 text-xs" title="Choose how to split performance.">
                  <template x-for="o in breakdownOptions" :key="o.id">
                    <option :value="o.id" x-text="o.label" :title="o.tip"></option>
                  </template>
                </select>
                <select x-model="tools.datePreset" @change="loadBreakdowns()"
                        class="border border-gray-300 rounded px-2 py-1 text-xs" title="Date range for the breakdown.">
                  <option value="today">Today</option>
                  <option value="yesterday">Yesterday</option>
                  <option value="last_7d">Last 7 days</option>
                  <option value="last_14d">Last 14 days</option>
                  <option value="last_30d">Last 30 days</option>
                  <option value="maximum">Maximum</option>
                </select>
                <button @click="loadBreakdowns()" class="text-xs text-meta-blue hover:underline" title="Reload this breakdown from Meta.">Refresh</button>
                <span class="text-[11px] text-meta-gray-500" x-show="tools.breakdowns.rows.length" x-text="tools.breakdowns.rows.length + ' rows'"></span>
              </div>
              <div x-show="tools.breakdowns.loading" class="text-sm text-meta-gray-600 py-8 text-center">Loading breakdown…</div>
              <div x-show="tools.breakdowns.error" class="text-sm text-red-600 py-4" x-text="tools.breakdowns.error"></div>
              <div x-show="!tools.breakdowns.loading && !tools.breakdowns.error && tools.breakdowns.rows.length === 0" class="text-sm text-meta-gray-600 py-8 text-center">No data for this breakdown / range.</div>
              <div class="overflow-x-auto scrollbar-thin">
              <table x-show="!tools.breakdowns.loading && tools.breakdowns.rows.length" class="w-full text-xs min-w-[480px]">
                <thead class="text-meta-gray-600 border-b border-gray-200">
                  <tr>
                    <template x-for="d in tools.breakdowns.dims" :key="d">
                      <th class="text-left py-1.5 pr-2 font-semibold uppercase tracking-wide" x-text="d.replace(/_/g,' ')"></th>
                    </template>
                    <th class="text-right py-1.5 px-2" title="Amount spent">Spend</th>
                    <th class="text-right py-1.5 px-2" title="Times shown">Impr.</th>
                    <th class="text-right py-1.5 px-2" title="Link click-through rate">CTR</th>
                    <th class="text-right py-1.5 px-2" title="Cost per link click">CPC</th>
                    <th class="text-right py-1.5 px-2" title="Purchases attributed">Purch.</th>
                    <th class="text-right py-1.5 px-2" title="Purchase conversion value">Value</th>
                    <th class="text-right py-1.5 pl-2" title="Return on ad spend (value ÷ spend)">ROAS</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(r, i) in tools.breakdowns.rows" :key="i">
                    <tr class="border-b border-gray-100 hover:bg-blue-50/40">
                      <template x-for="d in tools.breakdowns.dims" :key="d">
                        <td class="py-1.5 pr-2 capitalize" x-text="r[d]"></td>
                      </template>
                      <td class="py-1.5 px-2 text-right text-num" x-text="formatMoney(r.spend)"></td>
                      <td class="py-1.5 px-2 text-right text-num" x-text="r.impressions.toLocaleString()"></td>
                      <td class="py-1.5 px-2 text-right text-num" x-text="r.ctr != null ? r.ctr.toFixed(2) + '%' : '—'"></td>
                      <td class="py-1.5 px-2 text-right text-num" x-text="r.cpc != null ? formatMoney(r.cpc) : '—'"></td>
                      <td class="py-1.5 px-2 text-right text-num" x-text="r.purchases || '—'"></td>
                      <td class="py-1.5 px-2 text-right text-num" x-text="r.purchase_value ? formatMoney(r.purchase_value) : '—'"></td>
                      <td class="py-1.5 pl-2 text-right text-num font-semibold"
                          :class="r.roas == null ? 'text-meta-gray-400' : (r.roas >= 2 ? 'text-green-700' : (r.roas >= 1 ? 'text-amber-600' : 'text-red-600'))"
                          x-text="r.roas != null ? r.roas.toFixed(2) + 'x' : '—'"></td>
                    </tr>
                  </template>
                </tbody>
                <tfoot class="border-t-2 border-gray-300 font-semibold">
                  <tr>
                    <td class="py-1.5 pr-2" :colspan="tools.breakdowns.dims.length">Total</td>
                    <td class="py-1.5 px-2 text-right text-num" x-text="formatMoney(breakdownTotals().spend)"></td>
                    <td class="py-1.5 px-2 text-right text-num" x-text="breakdownTotals().impressions.toLocaleString()"></td>
                    <td class="py-1.5 px-2 text-right">—</td>
                    <td class="py-1.5 px-2 text-right">—</td>
                    <td class="py-1.5 px-2 text-right text-num" x-text="breakdownTotals().purchases || '—'"></td>
                    <td class="py-1.5 px-2 text-right text-num" x-text="breakdownTotals().purchase_value ? formatMoney(breakdownTotals().purchase_value) : '—'"></td>
                    <td class="py-1.5 pl-2 text-right text-num" x-text="breakdownTotals().roas != null ? breakdownTotals().roas.toFixed(2) + 'x' : '—'"></td>
                  </tr>
                </tfoot>
              </table>
              </div>
            </div>

            <!-- CHANGE HISTORY -->
            <div x-show="tools.tab === 'history'">
              <div class="flex items-center gap-2 mb-3">
                <button @click="loadActivities()" class="text-xs text-meta-blue hover:underline" title="Reload change history from Meta's activity log.">Refresh</button>
                <span class="text-[11px] text-meta-gray-500" x-text="tools.activities.rows.length + ' events for this ' + (tools.level || 'item')"></span>
              </div>
              <div x-show="tools.activities.loading" class="text-sm text-meta-gray-600 py-8 text-center">Loading history…</div>
              <div x-show="tools.activities.error" class="text-sm text-red-600 py-4" x-text="tools.activities.error"></div>
              <div x-show="!tools.activities.loading && !tools.activities.error && tools.activities.rows.length === 0" class="text-sm text-meta-gray-600 py-8 text-center">
                No recent changes recorded for this item (Meta's account log covers recent activity).
              </div>
              <ol x-show="tools.activities.rows.length" class="space-y-2">
                <template x-for="(a, i) in tools.activities.rows" :key="i">
                  <li class="flex items-start gap-3 text-xs border-b border-gray-100 pb-2">
                    <div class="w-2 h-2 rounded-full bg-meta-blue mt-1.5 flex-shrink-0"></div>
                    <div class="flex-1 min-w-0">
                      <div class="font-medium" x-text="a.label"></div>
                      <div class="text-meta-gray-600" x-show="activityValue(a.extra)" x-text="activityValue(a.extra)"></div>
                      <div class="text-meta-gray-500 mt-0.5">
                        <span x-text="a.actor || 'unknown'"></span>
                        <span class="mx-1">·</span>
                        <span x-text="a.time ? new Date(a.time).toLocaleString() : ''"></span>
                      </div>
                    </div>
                  </li>
                </template>
              </ol>
            </div>

            <!-- PREVIEW -->
            <div x-show="tools.tab === 'preview'">
              <div class="flex items-center gap-2 flex-wrap mb-3">
                <select x-model="tools.preview.format" @change="loadPreview()"
                        class="border border-gray-300 rounded px-2 py-1 text-xs" title="Choose a placement to preview the creative in.">
                  <template x-for="f in previewFormats" :key="f.id">
                    <option :value="f.id" x-text="f.label"></option>
                  </template>
                </select>
                <button @click="loadPreview()" class="text-xs text-meta-blue hover:underline" title="Reload the preview from Meta.">Refresh</button>
              </div>
              <div x-show="tools.preview.loading" class="text-sm text-meta-gray-600 py-8 text-center">Loading preview…</div>
              <div x-show="tools.preview.error" class="text-sm text-red-600 py-4" x-text="tools.preview.error"></div>
              <div id="tools-preview-host" x-show="!tools.preview.loading && !tools.preview.error" class="flex justify-center"></div>
            </div>

          </div>
        </div>
      </div>

      <!-- ============================ STRATEGY ADVISOR ============================ -->
